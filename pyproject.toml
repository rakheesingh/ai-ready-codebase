[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airead"
version = "0.1.0"
description = "Score and improve the AI-readiness of Python codebases, one function at a time."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ai-ready-codebase" }]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "radon>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = [
    "groq>=0.11",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
airead = "airead.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["airead*"]
exclude = ["samples*", "tests*"]

[tool.setuptools.package-data]
airead = ["ui/templates/*.html"]
